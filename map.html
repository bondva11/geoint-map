<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOINT Мониторинг</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1c1c1e; color: #fff; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; font-size: 18px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="loading">Загрузка маршрута цели...</div>
    <div id="map"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const encodedPoints = urlParams.get('points');

        if (!encodedPoints) {
            document.getElementById('loading').innerText = "Данные отсутствуют";
        } else {
            try {
                // Декодируем входящую строку
                const rawData = decodeURIComponent(encodedPoints);
                const points = JSON.parse(rawData);
                
                if (!points || points.length === 0) {
                    document.getElementById('loading').innerText = "Точек не найдено";
                } else {
                    // Прячем загрузку, код сработал!
                    document.getElementById('loading').style.display = 'none';
                    
                    // Берем самую первую пару координат из массива для теста
                    const firstRow = points[0];
                    const lat = parseFloat(firstRow[0]);
                    const lon = parseFloat(firstRow[1]);
                    
                    // Создаем карту
                    const map = L.map('map').setView([lat, lon], 15);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    // Ставим маркер в точку
                    L.marker([lat, lon]).addTo(map).bindPopup("<b>Цель зафиксирована</b>").openPopup();
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Ошибка: " + e;
            }
        }
    </script>
</body>
</html>
