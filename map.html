<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Перенаправление...</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const rawPoints = urlParams.get('points');

        if (rawPoints) {
            // Исправленная строка: жестко собираем ссылку на карты Google
            window.location.href = "https://google.com" + rawPoints;
        } else {
            document.body.innerText = "Ошибка: Координаты цели не переданы.";
        }
    </script>
</body>
</html>
