<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Перенаправление...</title>
</head>
<body>
    <script>
        // Читаем координаты "широта,долгота" из ссылки бота
        const urlParams = new URLSearchParams(window.location.search);
        const rawPoints = urlParams.get('points');

        if (rawPoints) {
            // Мгновенно перенаправляем браузер на официальные карты Google с точным маркером цели
            window.location.href = "https://google.com" + rawPoints;
        } else {
            document.body.innerText = "Ошибка: Координаты цели не переданы.";
        }
    </script>
</body>
</html>
