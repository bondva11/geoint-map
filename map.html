<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOINT Мониторинг</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1c1c1e; color: #fff; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; font-size: 18px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="loading">Загрузка маршрута цели...</div>
    <div id="map"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const encodedPoints = urlParams.get('points');

        if (!encodedPoints) {
            document.getElementById('loading').innerText = "Данные маршрута отсутствуют";
        } else {
            try {
                // Декодируем массив точек
                const points = JSON.parse(decodeURIComponent(encodedPoints));
                
                if (!points || points.length === 0) {
                    document.getElementById('loading').innerText = "У пользователя нет точек за сегодня";
                } else {
                    document.getElementById('loading').style.display = 'none';
                    
                    // Собираем чистый массив координат [[lat, lon], [lat, lon], ...]
                    const latLngs = points.map(p => [parseFloat(p[0]), parseFloat(p[1])]);
                    
                    // Центрируем карту по последней точке маршрута
                    const lastCoord = latLngs[latLngs.length - 1];
                    const map = L.map('map').setView(lastCoord, 15);

                    // Подключаем карту OpenStreetMap
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    // Рисуем синюю линию маршрута
                    const polyline = L.polyline(latLngs, {color: '#007aff', weight: 5, opacity: 0.8}).addTo(map);
                    
                    // Автоматически масштабируем карту под весь трек цели
                    if (latLngs.length > 1) {
                        map.fitBounds(polyline.getBounds());
                    }

                    // Ставим маркер на последнюю позицию
                    const lastPointData = points[points.length - 1];
                    L.marker(lastCoord)
                        .addTo(map)
                        .bindPopup(`<b>Текущая позиция цели</b><br>Время: ${lastPointData[2] || 'Не указано'}`)
                        .openPopup();
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Ошибка парсинга координат: " + e;
            }
        }
    </script>
</body>
</html>
