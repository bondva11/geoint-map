<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOINT Мониторинг</title>
    <!-- Полные и рабочие ссылки на библиотеки карт Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <!-- Оригинальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1c1c1e; color: #fff; font-family: sans-serif; }
        #map { height: 100%; width: 100%; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; font-size: 18px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div id="loading">Загрузка карты мониторинга...</div>
    <div id="map"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран телефона

        const urlParams = new URLSearchParams(window.location.search);
        const rawPoints = urlParams.get('points');

        if (!rawPoints) {
            document.getElementById('loading').innerText = "Данные о местоположении отсутствуют";
        } else {
            try {
                // Разделяем входящую строку "широта,долгота" по запятой
                const coords = rawPoints.split(',');
                const lat = parseFloat(coords[0]);
                const lon = parseFloat(coords[1]);

                if (isNaN(lat) || isNaN(lon)) {
                    document.getElementById('loading').innerText = "Неверный формат полученных координат";
                } else {
                    // Координаты успешно прочитаны, скрываем плашку загрузки
                    document.getElementById('loading').style.display = 'none';

                    // Инициализируем и центрируем карту OpenStreetMap
                    const map = L.map('map').setView([lat, lon], 16);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    // Устанавливаем маркер на текущую позицию цели
                    L.marker([lat, lon]).addTo(map).bindPopup("<b>Объект зафиксирован</b>").openPopup();
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Ошибка отрисовки карты: " + e;
            }
        }
    </script>
</body>
</html>
